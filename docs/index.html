<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Kettle Firmware Updater</title>

  <link rel="icon" href="./assets/kettle-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/kettle-icon.png">

  <!-- ADD THIS -->
  <style>
    :root {
      --bg: #0b1220;
      --panel: #101a2e;
      --text: #e9eefc;
      --muted: #a8b3d6;
      --accent: #2f81f7;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(47,129,247,0.25), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(255,255,255,0.08), transparent 55%),
        var(--bg);
      color: var(--text);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      padding: 6px;
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-top: 2px;
    }

    .brand-logo {
      height: 240px;
	  object-fit: contain;
	  padding: 8px;
	  border-radius: 16px;
	  background: rgba(255,255,255,0.06);
	  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      opacity: 0.95;
    }

    @media (max-width: 760px) {
      .brand-logo { display: none; }
    }
	.card {
	  background: rgba(16, 26, 46, 0.75);
	  border-radius: 12px;
	  padding: 18px;
	  margin: 14px 0;
	  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
	}

	.row {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  gap: 16px;
	}

	.title {
	  font-size: 18px;
	  font-weight: 600;
	}

	.meta {
	  font-size: 13px;
	  color: var(--muted);
	  margin-top: 4px;
	}

	.err {
	  color: #ff9b9b;
	}
  </style>
</head>

  <body>
	<header class="brand-header">
	  <div class="brand-left">
		<img class="brand-mark" src="./assets/kettle-icon.png" alt="Vulture Investment Club">
		<div>
		  <div class="brand-title">Kettle Firmware Updater</div>
		  <div class="brand-subtitle">Vulture Investment Club</div>
		</div>
	  </div>

	  <img class="brand-logo" src="./assets/vic-logo.png" alt="Vulture Investment Club">
	</header>

	<p>Ensure your Kettle is connected to your computer using the provided cable.</p>
    <p>Update your firmware by selecting an option below. (Stable is recommended.)</p>

    <div id="content">Loading…</div>

    <script>
      function card(label, info) {
        const div = document.createElement("div");
        div.className = "card";

        const row = document.createElement("div");
        row.className = "row";

        const left = document.createElement("div");
        left.innerHTML = `
          <div class="title">${label} — v${info.version}</div>
          <div class="meta">Released ${info.date}</div>
        `;

        const btn = document.createElement("esp-web-install-button");
        btn.setAttribute("manifest", info.manifest);

        row.appendChild(left);
        row.appendChild(btn);
        div.appendChild(row);
        return div;
      }

      (async () => {
        const el = document.getElementById("content");
        try {
          const releasesUrl = new URL("kettle-flasher/releases/releases.json", window.location.href);
		  const r = await fetch(releasesUrl, { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const cfg = await r.json();

          el.textContent = "";
          el.appendChild(card("Stable", cfg.stable));
          el.appendChild(card("Previous", cfg.previous));
        } catch (e) {
          el.innerHTML = `<p class="err">Failed to load release info: ${e}</p>`;
        }
      })();
	  <script type="module"
		src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module">
	  </script>
    </script>
  </body>
</html>
