<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Kettle Flasher — Vulture Investment Club</title>

  <link rel="icon" href="./assets/kettle-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/kettle-icon.png">

  <!-- ADD THIS -->
  <style>
    :root {
      --bg: #0b1220;
      --panel: #101a2e;
      --text: #e9eefc;
      --muted: #a8b3d6;
      --accent: #2f81f7;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(47,129,247,0.25), transparent 60%),
        radial-gradient(900px 500px at 90% 10%, rgba(255,255,255,0.08), transparent 55%),
        var(--bg);
      color: var(--text);
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      padding: 6px;
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-top: 2px;
    }

    .brand-logo {
      height: 46px;
      opacity: 0.9;
    }

    @media (max-width: 760px) {
      .brand-logo { display: none; }
    }
  </style>
</head>

  <body>
	<header class="brand-header">
	  <div class="brand-left">
		<img class="brand-mark" src="./assets/vic-mark.png" alt="Vulture Investment Club">
		<div>
		  <div class="brand-title">Kettle Flasher</div>
		  <div class="brand-subtitle">Vulture Investment Club</div>
		</div>
	  </div>

	  <img class="brand-logo" src="./assets/vic-logo.png" alt="Vulture Investment Club">
	</header>

	<p>Ensure your Kettle is connected to your computer using the provided cable.</p>
    <p>Update your firmware by selecting an option below. (Stable is recommended.)</p>

    <div id="content">Loading…</div>

    <script>
      function card(label, info) {
        const div = document.createElement("div");
        div.className = "card";

        const row = document.createElement("div");
        row.className = "row";

        const left = document.createElement("div");
        left.innerHTML = `
          <div class="title">${label} — v${info.version}</div>
          <div class="meta">Released ${info.date}</div>
        `;

        const btn = document.createElement("esp-web-install-button");
        btn.setAttribute("manifest", info.manifest);

        row.appendChild(left);
        row.appendChild(btn);
        div.appendChild(row);
        return div;
      }

      (async () => {
        const el = document.getElementById("content");
        try {
          const r = await fetch("releases/releases.json", { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const cfg = await r.json();

          el.textContent = "";
          el.appendChild(card("Stable", cfg.stable));
          el.appendChild(card("Previous", cfg.previous));
        } catch (e) {
          el.innerHTML = `<p class="err">Failed to load release info: ${e}</p>`;
        }
      })();
    </script>
  </body>
</html>
