<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kettle Flasher</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin: 12px 0; }
      .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
      .meta { color: #555; font-size: 0.95rem; }
      .title { font-size: 1.15rem; font-weight: 650; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>Kettle Flasher</h1>
	<p>Ensure your Kettle is connected to your computer using the provided cable.</p>
    <p>Update your firmware by selecting an option below. (Stable is recommended.)</p>

    <div id="content">Loading…</div>

    <script>
      function card(label, info) {
        const div = document.createElement("div");
        div.className = "card";

        const row = document.createElement("div");
        row.className = "row";

        const left = document.createElement("div");
        left.innerHTML = `
          <div class="title">${label} — v${info.version}</div>
          <div class="meta">Released ${info.date}</div>
        `;

        const btn = document.createElement("esp-web-install-button");
        btn.setAttribute("manifest", info.manifest);

        row.appendChild(left);
        row.appendChild(btn);
        div.appendChild(row);
        return div;
      }

      (async () => {
        const el = document.getElementById("content");
        try {
          const r = await fetch("releases/releases.json", { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const cfg = await r.json();

          el.textContent = "";
          el.appendChild(card("Stable", cfg.stable));
          el.appendChild(card("Previous", cfg.previous));
        } catch (e) {
          el.innerHTML = `<p class="err">Failed to load release info: ${e}</p>`;
        }
      })();
    </script>
  </body>
</html>
